[project]
name = "bl2speed"
version = "1.0.0"
authors = [{ name = "NK" }]
description = """\
Increases sprint speed in Borderlands 2 by a configurable multiplier, \
leaving normal walking speed untouched.
"""

[project.urls]
Source = "https://github.com/NKAYE0/BL2speed"

[tool.sdkmod]
name = "Speed"
license = { name = "GPL-3.0", url = "https://www.gnu.org/licenses/gpl-3.0.en.html" }
# Untested in coop - single player only so far.
coop_support = "Unknown"
supported_games = ["BL2"]
download = "https://github.com/NKAYE0/BL2speed/releases/latest/download/bl2speed.sdkmod"
